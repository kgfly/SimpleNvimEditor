# nfpm config -- builds .deb and .rpm from a prebuilt binary.
# Driven by package.yml; VERSION and ARCH come from the environment.
# Docs: https://nfpm.goreleaser.com/configuration/

name: simplenvim
arch: ${ARCH}
version: ${VERSION}
version_schema: none
release: 1
section: editors
priority: optional
maintainer: kgfly <noreply@github.com>
description: |
  A simple, fast, native Neovim GUI written in Go using the Gio toolkit.
  Drives a real, unmodified nvim process in a native GPU-rendered window.
vendor: kgfly
homepage: https://github.com/kgfly/SimpleNvimEditor
license: MIT

contents:
  - src: stage/simplenvim
    dst: /usr/bin/simplenvim
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/simplenvim/LICENSE
  - src: README.md
    dst: /usr/share/doc/simplenvim/README.md
  - src: packaging/linux/simplenvim.desktop
    dst: /usr/share/applications/simplenvim.desktop
  - src: packaging/linux/icons/simplenvim_16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/simplenvim.png
  - src: packaging/linux/icons/simplenvim_512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/simplenvim.png

# Neovim is a hard runtime requirement: this is a GUI *for* nvim, and the app
# exits immediately if it cannot spawn the process.
depends:
  - neovim

overrides:
  rpm:
    depends:
      - neovim
