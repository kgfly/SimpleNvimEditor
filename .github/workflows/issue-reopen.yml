name: Allow author to reopen issue

on:
  issue_comment:
    types: [created]

jobs:
  reopen:
    if: >-
      github.event.issue.state == 'closed'
      && contains(github.event.comment.body, '/reopen')
      && github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reopen issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: gh issue reopen "$ISSUE_NUM" -R "$REPO"
      - name: React to acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_URL: ${{ github.event.comment.url }}
        run: |
          gh api "$COMMENT_URL/reactions" -f content='+1'
