name: Package

# Reusable workflow: turns the raw binaries from build-matrix.yml into
# OS-native installers -- .deb/.rpm (nfpm), Windows .exe (Inno Setup), and
# macOS .dmg (hdiutil). Called by release.yml after the build matrix.
#
# Everything here is unsigned (Phase 1). See doc/ci-cd-setup.md section 8 for
# what signing would add and why it is deliberately deferred.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version, without the leading v (e.g. 1.2.3).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-packages:
    name: .deb / .rpm (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: incoming

      - name: Install nfpm
        run: |
          set -euo pipefail
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Stage binary
        run: |
          set -euo pipefail
          mkdir -p stage
          tar xzf incoming/*.tar.gz -C stage
          chmod +x stage/simplenvim
          ls -l stage

      - name: Build packages
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-windows-amd64
          path: incoming

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          unzip -o incoming/*.zip -d stage
          ls -l stage

      - name: Compile installer
        run: |
          iscc /DMyAppVersion="${{ inputs.version }}" /DMyAppArch="amd64" packaging/windows/simplenvim.iss

      - name: Build MSI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dotnet tool install --global wix
          wix build packaging/windows/simplenvim.wxs \
            -d Version="${{ inputs.version }}" \
            -d Arch="x64" \
            -d BinaryDir="$(pwd)/stage" \
            -o "dist/simplenvim_${{ inputs.version }}_windows_amd64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-amd64
          path: |
            packaging/windows/Output/*.exe
            dist/*.msi
          if-no-files-found: error

  macos-dmg:
    name: macOS .dmg (${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-${{ matrix.goarch }}
          path: incoming

      - name: Build .app bundle and .dmg
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: bash packaging/macos/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: package-darwin-${{ matrix.goarch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux-arch:
    name: Arch .pkg.tar.zst (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: incoming

      - name: Build .pkg.tar.zst
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p stage dist

          tar xzf incoming/*.tar.gz -C stage
          chmod +x stage/simplenvim

          if [ "$ARCH" = "amd64" ]; then pkgarch="x86_64"; else pkgarch="aarch64"; fi

          pkgdir="$(pwd)/pkgroot"
          mkdir -p "$pkgdir/usr/bin" "$pkgdir/usr/share/doc/simplenvim" "$pkgdir/usr/share/licenses/simplenvim"
          cp stage/simplenvim "$pkgdir/usr/bin/"
          cp README.md "$pkgdir/usr/share/doc/simplenvim/"
          cp LICENSE "$pkgdir/usr/share/licenses/simplenvim/"

          cat > .PKGINFO <<EOF
          pkgname = simplenvim
          pkgver = ${VERSION}-1
          pkgdesc = A simple, fast, native Neovim GUI written in Go using Gio
          url = https://github.com/kgfly/SimpleNvimEditor
          arch = ${pkgarch}
          license = MIT
          depend = neovim
          EOF
          sed -i 's/^          //' .PKGINFO

          # Build the package archive
          cd "$pkgdir"
          cp ../.PKGINFO .
          tar cf "../dist/simplenvim_${VERSION}_linux_${ARCH}.pkg.tar.zst" \
            --zstd .PKGINFO usr/

      - uses: actions/upload-artifact@v4
        with:
          name: package-arch-${{ matrix.goarch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
